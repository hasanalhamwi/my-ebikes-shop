<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background badge -->
  <circle cx="100" cy="100" r="96" fill="#16211d" stroke="#d98e2b" stroke-width="4"/>

  <!-- Wheels -->
  <circle cx="58" cy="146" r="30" fill="none" stroke="#f2ede2" stroke-width="5"/>
  <circle cx="142" cy="146" r="30" fill="none" stroke="#f2ede2" stroke-width="5"/>
  <circle cx="58" cy="146" r="4" fill="#f2ede2"/>
  <circle cx="142" cy="146" r="4" fill="#f2ede2"/>

  <!-- Frame (all tubes in the same cream color) -->
  <g stroke="#f2ede2" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="58" y1="146" x2="96" y2="146"/>   <!-- chainstay -->
    <line x1="96" y1="146" x2="72" y2="84"/>    <!-- seat tube -->
    <line x1="58" y1="146" x2="72" y2="84"/>    <!-- seat stay -->
    <line x1="72" y1="84" x2="136" y2="80"/>    <!-- top tube -->
    <line x1="96" y1="146" x2="136" y2="80"/>   <!-- down tube -->
    <line x1="136" y1="80" x2="142" y2="146"/>  <!-- fork -->
  </g>

  <!-- Seat -->
  <line x1="63" y1="82" x2="81" y2="79" stroke="#f2ede2" stroke-width="6" stroke-linecap="round"/>

  <!-- Handlebar -->
  <line x1="127" y1="72" x2="145" y2="68" stroke="#f2ede2" stroke-width="6" stroke-linecap="round"/>

  <!-- Pedal crank -->
  <circle cx="96" cy="146" r="6" fill="none" stroke="#f2ede2" stroke-width="3"/>

  <!-- Electric bolt, sitting inside the main frame triangle -->
  <polygon points="107.5,84.5 90.5,116.5 100.5,116.5 95.5,141.5 117.5,107.5 106.5,107.5"
           fill="#d98e2b" stroke="#16211d" stroke-width="2"/>
</svg>
