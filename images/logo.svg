<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background badge -->
  <circle cx="100" cy="100" r="96" fill="#16211d" stroke="#d98e2b" stroke-width="4"/>

  <!-- Wheel rim -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="#f2ede2" stroke-width="5"/>

  <!-- Hub -->
  <circle cx="100" cy="100" r="9" fill="#f2ede2"/>

  <!-- Spokes -->
  <g stroke="#f2ede2" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="38"/>
    <line x1="100" y1="100" x2="154" y2="69"/>
    <line x1="100" y1="100" x2="154" y2="131"/>
    <line x1="100" y1="100" x2="100" y2="162"/>
    <line x1="100" y1="100" x2="46" y2="131"/>
    <line x1="100" y1="100" x2="46" y2="69"/>
  </g>

  <!-- Lightning bolt (electric accent), overlaid in brand amber -->
  <polygon points="112,44 78,108 98,108 88,158 132,90 110,90"
           fill="#d98e2b" stroke="#16211d" stroke-width="3"/>
</svg>
