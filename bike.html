<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fietsdetails — e-bikes.gereviseerd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">e-bikes<span>.gereviseerd</span></a>
    <nav>
      <a href="index.html">Alle fietsen</a>
    </nav>
  </div>
</header>

<section class="bike-detail">
  <div class="container">
    <a href="index.html" class="back-link">&larr; Terug naar alle fietsen</a>
    <div id="bike-content">
      <!-- filled automatically from data/bikes.json based on the ?id= in the URL -->
    </div>

    <!-- Fullscreen image viewer, opened when a slider photo is clicked -->
    <div class="lightbox" id="lightbox" hidden>
      <button class="lightbox-close" id="lightbox-close" aria-label="Sluiten">&times;</button>
      <button class="slider-btn prev" id="lightbox-prev" aria-label="Vorige foto">&#8249;</button>
      <img id="lightbox-img" src="" alt="">
      <button class="slider-btn next" id="lightbox-next" aria-label="Volgende foto">&#8250;</button>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">&copy; <span id="year"></span> e-bikes.gereviseerd — alle fietsen handmatig gecontroleerd en klaargemaakt</div>
</footer>

<script src="js/bike.js"></script>
</body>
</html>
